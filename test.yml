---
- name: Test ServiceNow connectivity
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Check ServiceNow HTTPS endpoint
      ansible.builtin.uri:
        url: "https://dev431630.service-now.com"
        method: GET
        validate_certs: true
        status_code: [200, 301, 302, 401, 403]
      register: snow_response
      changed_when: false

    - name: Display HTTP status
      ansible.builtin.debug:
        msg: "ServiceNow returned HTTP {{ snow_response.status }}"
